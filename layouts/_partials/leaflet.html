{{- /* leaflet route map — loaded only on pages that set .Store "hasMap" (see baseof.html).
       decodes the Strava summary_polyline from #fit-map[data-polyline] and draws
       the route with start (green) / end (red) markers. */ -}}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(() => {
  // decode a Google/Strava encoded polyline into [[lat,lng], ...]
  function decodePolyline(str, precision = 5) {
    let index = 0, lat = 0, lng = 0;
    const coords = [], factor = Math.pow(10, precision);
    while (index < str.length) {
      let result = 1, shift = 0, b;
      do { b = str.charCodeAt(index++) - 63 - 1; result += b << shift; shift += 5; } while (b >= 0x1f);
      lat += (result & 1) ? ~(result >> 1) : (result >> 1);
      result = 1; shift = 0;
      do { b = str.charCodeAt(index++) - 63 - 1; result += b << shift; shift += 5; } while (b >= 0x1f);
      lng += (result & 1) ? ~(result >> 1) : (result >> 1);
      coords.push([lat / factor, lng / factor]);
    }
    return coords;
  }

  function init() {
    const el = document.getElementById('fit-map');
    if (!el || !window.L) return;
    const encoded = el.dataset.polyline;
    const pts = encoded ? decodePolyline(encoded) : [];
    const map = L.map(el, { scrollWheelZoom: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap contributors',
    }).addTo(map);
    if (pts.length) {
      const line = L.polyline(pts, { color: '#fc4c02', weight: 4 }).addTo(map);
      L.circleMarker(pts[0], { radius: 6, color: '#216e39', fillColor: '#40c463', fillOpacity: 1 })
        .addTo(map).bindTooltip('start');
      L.circleMarker(pts[pts.length - 1], { radius: 6, color: '#8b1a1a', fillColor: '#e5534b', fillOpacity: 1 })
        .addTo(map).bindTooltip('finish');
      map.fitBounds(line.getBounds(), { padding: [20, 20] });
    } else {
      map.setView([0, 0], 2);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
